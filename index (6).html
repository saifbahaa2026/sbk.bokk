html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px}
.logo{display:block;width:190px;max-width:55%;margin:0 auto 18px;border-radius:12px}
h1{margin:0;text-align:center;font-weight:700;font-size:26px}
h1 span{font-family:'Cormorant Garamond',serif;font-size:28px;margin-inline-start:8px}
.rule{height:1px;background:var(--line);width:70%;margin:14px auto 24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px}
.cat{text-align:center;color:inherit;text-decoration:none}
.tile{position:relative;overflow:hidden;aspect-ratio:3/4;background:var(--tile);border-radius:14px 4px 4px 14px;box-shadow:-3px 0 0 #D4D3CE,-5px 0 0 var(--soft),0 8px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding-inline-start:0;padding-right:14%;margin-left:6px}.tile::before{content:'';position:absolute;top:0;bottom:0;right:0;width:14%;background:linear-gradient(90deg,#1E20AA,#12147a);border-left:2px solid var(--line)}.tile::after{content:'';position:absolute;left:12%;right:26%;bottom:10%;height:2px;background:var(--line);opacity:.6}
.tile svg{width:52%;height:52%;margin-bottom:8%;stroke:var(--icon);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.en{display:block;margin-top:8px;font-size:13px;font-weight:700}
.ar{display:block;font-size:14px;color:var(--soft);font-weight:500}

[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.back svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h2{margin:0;font-size:22px;font-weight:700}
.top h2 small{display:block;font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--soft);font-weight:600}
.bgrid{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:10px 18px 26px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bgrid::-webkit-scrollbar{display:none}
.book{flex:0 0 58%;scroll-snap-align:center;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.book{animation:none}}
.hint{text-align:center;color:var(--soft);font-size:13px;margin-top:4px}
.cover{position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:14px 4px 4px 14px;margin-left:6px;background:linear-gradient(160deg,#1E20AA,#12147a);box-shadow:-3px 0 0 #D4D3CE,-5px 0 0 var(--soft),0 8px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:14% 22% 14% 12%;text-align:center}
.cover::before{content:'';position:absolute;top:0;bottom:0;right:0;width:12%;background:#fff;opacity:.9}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover span{font-weight:700;font-size:17px;line-height:1.5}
.bname{margin-top:12px;font-weight:700;font-size:15px;line-height:1.4}
.bauthor{font-size:13px;color:var(--soft)}
.price{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:999px;background:#fff;color:var(--bg);font-weight:700;font-size:14px}

.hero{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s ease,opacity .4s ease}
.hero>div{overflow:hidden;min-height:0}
body.open .hero{grid-template-rows:0fr;opacity:0}
.cat{cursor:pointer}
.cat.on .tile{outline:3px solid #fff;outline-offset:4px}
.panel{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s ease}
.panel.show{grid-template-rows:1fr}
.panel>div{overflow:hidden;min-height:0}
.panel .bgrid{margin:0;padding:12px 6px 18px}
.ptitle{font-weight:700;font-size:18px;margin:6px 6px 0}
.ptitle small{font-family:'Cormorant Garamond',serif;color:var(--soft);margin-inline-start:8px;font-size:16px}

.grid{grid-auto-flow:row dense}
.cat.on{grid-column:1/-1}
.cat.on .tile{aspect-ratio:auto;display:block;padding:12px 14px 6px 14px;padding-right:50px;border-radius:16px 5px 5px 16px}
.cat.on .tile::before{width:36px}
.cat.on .tile::after{display:none}
.cat.on .tile>svg{display:none}
.cat.on .en,.cat.on .ar{display:none}
.inside{color:var(--bg);animation:fade .45s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.inside .ptitle{display:flex;align-items:center;justify-content:space-between;margin:0;font-size:19px;color:var(--bg);cursor:pointer}
.inside .ptitle small{color:#545456}
.inside .ptitle i{font-style:normal;font-size:26px;line-height:1;color:var(--bg);padding:0 6px}
.inside .bgrid{padding:12px 4px 12px}
.inside .book{flex:0 0 46%}
.inside .bname{color:var(--bg)}
.inside .bauthor{color:#545456}
.inside .price{background:var(--bg);color:#fff}
.inside .hint{color:#545456;margin:0 0 4px}

.shelf{display:block}
.shelfcat{position:relative;overflow:hidden;background:#E9E8E4;border-radius:16px 5px 5px 16px;margin:0 6px 30px 6px;padding:14px 14px 6px 14px;padding-right:52px;box-shadow:-3px 0 0 #D4D3CE,-5px 0 0 var(--soft),0 8px 14px rgba(0,0,0,.35)}
.shelfcat::before{content:'';position:absolute;top:0;bottom:0;right:0;width:36px;background:linear-gradient(90deg,#1E20AA,#12147a);border-left:2px solid var(--line)}
.shelfcat .book{animation:none;opacity:0}
.shelfcat.in .book{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.shelfcat .book{opacity:1}.shelfcat.in .book{animation:none}}
.thead{display:flex;align-items:center;gap:10px}
.ico svg{display:block;width:30px;height:30px;stroke:var(--bg);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.shelfcat .ptitle{cursor:default}

.logo{border-radius:0}
.tile{aspect-ratio:1;border:2px solid var(--line);border-radius:22px;box-shadow:none;margin-left:0;padding:0}
.tile::before,.tile::after{display:none}
.tile svg{width:56%;height:56%;margin-bottom:0}
.cat.on .tile{aspect-ratio:auto;display:block;padding:14px 14px 4px;border-radius:22px}
.hero{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 -18px 14px;padding:6px 18px 10px;box-shadow:0 12px 14px -10px rgba(0,0,0,.45)}
.hero .logo{width:118px;max-width:none;margin:0 auto}

.sec{margin-top:46px;scroll-margin-top:150px}
.sec h2{margin:0;text-align:center;font-size:30px;font-weight:700;color:var(--head)}
.sec .sub{text-align:center;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--soft);margin-top:2px}
.sec .rule{margin:14px auto 20px;width:60%}
.sec.collapsed:not(.sq) .item.extra{display:none!important}
.sec.sq .allbtn{display:none}
.allbtn{display:block;margin:6px auto 0;padding:12px 28px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--head);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.item{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;border:1.5px solid var(--line);border-radius:22px;background:var(--card);opacity:0}
.item.in{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.item{opacity:1}.item.in{animation:none}}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:18px;line-height:1.5;color:var(--name)}
.item .au{font-size:14px;color:var(--soft);margin-top:2px}
.item .pr{margin-top:8px;font-weight:700;font-size:17px;color:var(--price)}
.item .th{flex:none;width:96px;aspect-ratio:2/3;border-radius:10px 4px 4px 10px;overflow:hidden;position:relative}
.item .th img{width:100%;height:100%;object-fit:cover;display:block}
.item .th.cv{background:linear-gradient(160deg,#2224c0,#12147a);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 22px 10px 10px;font-weight:700;font-size:13px;line-height:1.4}
.item .th.cv::before{content:'';position:absolute;top:0;bottom:0;right:0;width:12%;background:#E9E8E4}

.item .soon,.soon{text-align:center;color:var(--soft);padding:18px 0}
#gate{position:fixed;inset:0;z-index:200;background:rgba(0,0,40,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{background:#E9E8E4;color:#1E20AA;border-radius:20px;padding:22px;width:100%;max-width:320px;text-align:center}
.gt{font-weight:700;font-size:20px;margin-bottom:12px}
.gm{color:#b00020;min-height:22px;font-size:14px;margin-top:6px}
.gbox input{text-align:center;letter-spacing:6px}
#admin{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 100px)}
.abox{max-width:520px;margin:0 auto}
.atop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.atop h2{margin:0;font-size:22px}
.ah{margin:20px 0 10px;font-size:18px}
.abtn{background:#E9E8E4;color:#1E20AA;border:0;border-radius:12px;padding:10px 14px;font:700 14px 'Cairo',system-ui,sans-serif;cursor:pointer}
.abtn.ghost{background:transparent;color:#fff;border:1.5px solid var(--line)}
.abtn.danger{background:#fff;color:#b00020}
#admin select,#admin input[type=text],#gate input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:#111;font:500 16px 'Cairo',system-ui,sans-serif}
#admin label{display:block;margin:10px 0 4px;font-size:14px;color:var(--soft)}
.aform label{color:var(--soft)}
.aform{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;background:rgba(255,255,255,.07)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.arow{display:flex;gap:10px;align-items:center;padding:10px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;background:rgba(255,255,255,.07);flex-wrap:wrap}
.arow .at{width:44px;height:66px;border-radius:6px;overflow:hidden;background:#12147a;flex:none}
.arow .at img{width:100%;height:100%;object-fit:cover;display:block}
.arow .ai{flex:1;min-width:90px;font-weight:700}
.arow .ai small{display:block;color:var(--soft);font-weight:500}
.apv{display:block;width:100px;border-radius:8px;margin:10px 0}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:101;background:#12147a;border-top:1.5px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:12px;align-items:center;justify-content:space-between}
.ast{font-size:14px;color:#fff}

body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
radial-gradient(120% 60% at 50% 0%,var(--glow),transparent 70%),
radial-gradient(100% 50% at 50% 100%,var(--shade),transparent 75%),
var(--patimg) repeat center top/326px auto}
.hero{background:rgba(30,32,170,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.item,.aform,.arow{-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.tile .timg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero{position:static;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;margin:0 0 6px;padding:10px 0 0}
.hero .logo{width:250px;max-width:70%;margin:0 auto 12px}
.sec{scroll-margin-top:20px}
@keyframes pop{0%{opacity:0;transform:translateY(34px) scale(.78)}60%{opacity:1;transform:translateY(-4px) scale(1.04)}100%{opacity:1;transform:none}}
.grid.go .cat{animation:pop .7s cubic-bezier(.2,.9,.3,1) both}
@media (prefers-reduced-motion:reduce){.grid.go .cat{animation:none}}
.item .ds{font-size:13.5px;line-height:1.7;color:var(--soft);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item.open .ds{display:block;-webkit-line-clamp:unset;overflow:visible}
.item.has{cursor:pointer}
.item .mr{font-size:12px;color:var(--price);opacity:.85;margin-top:2px}
#admin textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:#111;font:500 16px 'Cairo',system-ui,sans-serif;resize:vertical}
.foot{margin:46px 0 10px}
.fbox{background:var(--fbg);color:var(--fink);border:1.5px solid var(--line);border-radius:22px;padding:18px 18px 12px;box-shadow:0 8px 14px rgba(0,0,0,.18)}
.fbox h3{margin:0 0 6px;font-size:20px;text-align:center}
.frow{display:flex;align-items:center;gap:12px;padding:12px 4px;color:inherit;text-decoration:none;border-top:1px solid var(--fline);font-weight:700;font-size:17px}
.fbox h3+.frow{border-top:0}
.frow svg{width:24px;height:24px;stroke:var(--fink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.frow .num{direction:ltr;unicode-bidi:embed}
.frow .hd{margin-inline-end:auto;direction:ltr}
.sbtn{background:var(--sbtnbg);color:var(--sbtnink);border-radius:999px;padding:6px 14px;font-size:14px;text-decoration:none;font-weight:700}
.tag{text-align:center;color:var(--soft);font-size:18px;font-weight:500;margin:-6px 0 4px}
.igrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.ib{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:#E9E8E4;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ib svg{width:60%;height:60%;stroke:#1E20AA;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.sel{outline:3px solid #fff;outline-offset:2px}
.sbox{position:relative;margin:2px 0 20px}
.sbox input{width:100%;padding:13px 46px;border-radius:999px;border:1.5px solid var(--line);background:var(--sbg);color:var(--sink);font:600 16px 'Cairo',system-ui,sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:#7b7cc0;font-weight:500}
.sbox input::-webkit-search-cancel-button{display:none}
.sico{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none}
.sico svg{width:22px;height:22px;stroke:var(--sink);fill:none;stroke-width:2;stroke-linecap:round}
.sclr{position:absolute;left:12px;top:50%;transform:translateY(-50%);border:0;background:#1E20AA;color:#fff;width:26px;height:26px;border-radius:50%;font-size:13px;cursor:pointer;line-height:1;padding:0}
.sclr[hidden],.nores[hidden]{display:none}
.nores{text-align:center;color:var(--soft);padding:30px 0;font-size:17px}
#home.searching>.grid,#home.searching>h1,#home.searching>.rule{display:none}
.grid{grid-template-columns:repeat(6,1fr)}
.grid .cat{grid-column:span 2}
.grid .cat:nth-last-child(2):nth-child(3n+1){grid-column:2/span 2}
.grid .cat:last-child:nth-child(3n+1){grid-column:3/span 2}

#admin{--bg:#1E20AA;--ink:#fff;--soft:#B8B8BC;--line:#B8B8BC;--tile:#E9E8E4;color:#fff}
.lb{display:none}
html[data-theme="cream"] .lw,html[data-theme="white"] .lw{display:none}
html[data-theme="cream"] .lb,html[data-theme="white"] .lb{display:block}

  if(!draft.t&&!draft.img){statusMsg='اكتب اسم الكتاب أو اختر صورة';drawAdmin();return}
  var rec={t:(draft.t||'').trim(),a:(draft.a||'').trim(),d:(draft.d||'').trim(),p:normPrice(draft.p),img:draft.img||''};
  var arr=state.books[selCat]||[],cid=selCat,gone=[];
  if(editing===-1){gone=arr.filter(function(b){return b.s}).map(function(b){return b.id});arr=arr.filter(function(b){return !b.s});rec.id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);rec.o=Date.now();arr.push(rec)}
  else{rec.id=arr[editing].id;rec.o=arr[editing].o||Date.now();arr[editing]=rec}
  state.books[selCat]=arr;editing=null;statusMsg='';drawAdmin();render();
  persist(function(){return window.cloud.setBook(cid,rec,gone)});
}
function saveCat(){
  if(!catForm.ar.trim()){statusMsg='اكتب اسم القسم بالعربي';drawAdmin();return}
  var cobj;
  if(catForm.mode==='add'){var id='c'+Date.now();cobj={id:id,ar:catForm.ar.trim(),en:catForm.en.trim(),img:catForm.img||'',icon:catForm.icon||'openbook',o:Date.now()};state.cats.push(cobj);state.books[id]=[];selCat=id}
  else{cobj=curCat();cobj.ar=catForm.ar.trim();cobj.en=catForm.en.trim();cobj.img=catForm.img||'';cobj.icon=catForm.icon||''}
  catForm=null;statusMsg='';drawAdmin();render();
  persist(function(){return window.cloud.setCat(cobj)});
}

  var box=el('div','abox');

  box.appendChild(el('h3','ah','ثيم الصفحة (لون الخلفية)'));
  var tr=el('div','row');

    var d=el('span','dot');d.style.background=t[2];d.style.border='1.5px solid #B8B8BC';b.appendChild(d);b.appendChild(el('span','',t[1]));
    b.onclick=function(){state.theme=t[0];applyTheme();drawAdmin();persist(function(){return window.cloud.setSettings(state.info,state.theme)})};tr.appendChild(b);
  });
  box.appendChild(tr);
  if(cloudOn()&&window.cloud.empty){var ib2=el('div','aform');ib2.appendChild(el('div','','قاعدة البيانات فاضية. اضغط الزر لرفع الأقسام والكتب الحالية مرة وحدة.'));ib2.appendChild(btn('رفع البيانات الأولية','',function(){persist(function(){return window.cloud.uploadAll(state)})}));box.appendChild(ib2)}
  var sel=document.createElement('select');
  state.cats.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.ar;if(c.id===selCat)o.selected=true;sel.appendChild(o)});
  sel.onchange=function(){selCat=sel.value;editing=null;catForm=null;confirmKey=null;drawAdmin()};
  box.appendChild(field('القسم',sel));
  var cr=el('div','row');
  cr.appendChild(btn('قسم جديد','ghost',function(){catForm={mode:'add',ar:'',en:'',img:'',icon:'openbook'};drawAdmin()}));
  cr.appendChild(btn('تعديل اسم القسم','ghost',function(){var c=curCat();catForm={mode:'edit',ar:c.ar,en:c.en,img:c.img||'',icon:c.icon||(ICONLIB[c.id]?c.id:'openbook')};drawAdmin()}));
  cr.appendChild(askDel('cat','حذف القسم',delCat));
  cr.appendChild(askDel('samples','حذف كل الأمثلة',delSamples));
  box.appendChild(cr);
  var ir=el('div','row');ir.appendChild(btn('معلومات المكتبة (هاتف / عنوان)','ghost',function(){var o=state.info||{};infoForm={p1:o.p1||'',p2:o.p2||'',addr:o.addr||'',h:o.h||'',tag:o.tag||''};drawAdmin()}));box.appendChild(ir);
  
  if(infoForm){
    var nf=el('div','aform');
    var p1=inp(infoForm.p1,'07xxxxxxxxx','tel'),p2=inp(infoForm.p2,'07xxxxxxxxx (اختياري)','tel'),hI=inp(infoForm.h,'Sbk_book');
    var aD=document.createElement('textarea');aD.rows=3;aD.value=infoForm.addr;aD.placeholder='مثال: بغداد - الكرادة - شارع ...';
    p1.oninput=function(){infoForm.p1=p1.value};p2.oninput=function(){infoForm.p2=p2.value};hI.oninput=function(){infoForm.h=hI.value};aD.oninput=function(){infoForm.addr=aD.value};
    var tg2=inp(infoForm.tag,'مثال: لكتب الثقافة والأدب');tg2.oninput=function(){infoForm.tag=tg2.value};
    nf.appendChild(field('وصف المكتبة (تحت الشعار)',tg2));nf.appendChild(field('رقم الهاتف',p1));nf.appendChild(field('رقم هاتف ثاني',p2));nf.appendChild(field('عنوان المكتبة',aD));nf.appendChild(field('حساب إنستغرام / تلكرام',hI));
    var r4=el('div','row');r4.appendChild(btn('حفظ المعلومات','',function(){state.info={p1:infoForm.p1.trim(),p2:infoForm.p2.trim(),addr:infoForm.addr.trim(),h:infoForm.h.trim(),tag:infoForm.tag.trim()};infoForm=null;statusMsg='';drawAdmin();render();persist(function(){return window.cloud.setSettings(state.info,state.theme)})}));r4.appendChild(btn('إلغاء','ghost',function(){infoForm=null;drawAdmin()}));
    nf.appendChild(r4);box.appendChild(nf);
  }
  if(catForm){
    var cf=el('div','aform');
    var ai=inp(catForm.ar,'مثال: روايات'),ei=inp(catForm.en,'Novels');
    ai.oninput=function(){catForm.ar=ai.value};ei.oninput=function(){catForm.en=ei.value};
    cf.appendChild(field('اسم القسم',ai));
    var cfi=el('input');cfi.type='file';cfi.accept='image/*';
    cfi.onchange=function(){if(cfi.files[0])resize(cfi.files[0],300,300,function(d){catForm.img=d;drawAdmin()})};
    var ig=el('div','igrid');
    Object.keys(ICONLIB).forEach(function(k){var ib=el('button','ib'+(catForm.icon===k&&!catForm.img?' sel':''));ib.type='button';ib.innerHTML=ICONLIB[k];ib.onclick=function(){catForm.icon=k;catForm.img='';drawAdmin()};ig.appendChild(ib)});
    cf.appendChild(field('شكل الأيقونة (اختار واحدة)',ig));
    cf.appendChild(field('أو ارفع صورة بدل الأيقونة',cfi));
    if(catForm.img){var cpv=el('img','apv');cpv.src=catForm.img;cf.appendChild(cpv);cf.appendChild(btn('رجوع للأيقونة','ghost',function(){catForm.img='';drawAdmin()}))}
    var r2=el('div','row');r2.appendChild(btn('حفظ القسم','',saveCat));r2.appendChild(btn('إلغاء','ghost',function(){catForm=null;drawAdmin()}));
    cf.appendChild(r2);box.appendChild(cf);
  }
  box.appendChild(el('h3','ah','كتب القسم'));
  var bs=state.books[selCat]||[];
  if(!bs.length)box.appendChild(el('div','soon','ما فيه كتب بهذا القسم'));
  bs.forEach(function(b,i){
    var row=el('div','arow'),th=el('div','at');
    if(b.img){var im=el('img');im.src=b.img;th.appendChild(im)}
    var info=el('div','ai',b.t||'(بدون اسم)');if(b.p)info.appendChild(el('small','',b.p+' د.ع'));
    row.appendChild(th);row.appendChild(info);
    row.appendChild(btn('تعديل','ghost',function(){editing=i;draft={t:b.t,a:b.a,d:b.d||'',p:b.p,img:b.img};confirmKey=null;drawAdmin()}));
    row.appendChild(askDel('b'+i,'حذف',function(){var bid=state.books[selCat][i].id;state.books[selCat].splice(i,1);drawAdmin();render();persist(function(){return window.cloud.delBook(bid)})}));
    box.appendChild(row);
  });
  if(editing===null){
    box.appendChild(btn('+ إضافة كتاب','',function(){editing=-1;draft={t:'',a:'',d:'',p:'',img:''};confirmKey=null;drawAdmin()}));
  }else{
    var f=el('div','aform');
    var tI=inp(draft.t,'اسم الكتاب'),aI=inp(draft.a,'المؤلف (اختياري)'),pI=inp(draft.p,'مثال: 10000','numeric');
    tI.oninput=function(){draft.t=tI.value};aI.oninput=function(){draft.a=aI.value};pI.oninput=function(){draft.p=pI.value};
    var dI=document.createElement('textarea');dI.rows=4;dI.value=draft.d||'';dI.placeholder='نبذة قصيرة عن الكتاب (اختياري)';dI.oninput=function(){draft.d=dI.value};
    f.appendChild(field('اسم الكتاب',tI));f.appendChild(field('المؤلف',aI));f.appendChild(field('نبذة عن الكتاب',dI));f.appendChild(field('السعر (دينار)',pI));
    var fi=el('input');fi.type='file';fi.accept='image/*';
    fi.onchange=function(){if(fi.files[0])resize(fi.files[0],300,450,function(d){draft.img=d;drawAdmin()})};
    f.appendChild(field('صورة الغلاف',fi));
    if(draft.img){var pv=el('img','apv');pv.src=draft.img;f.appendChild(pv);f.appendChild(btn('حذف الصورة','ghost',function(){draft.img='';drawAdmin()}))}
    var r3=el('div','row');r3.appendChild(btn('حفظ الكتاب','',saveBook));r3.appendChild(btn('إلغاء','ghost',function(){editing=null;drawAdmin()}));
    f.appendChild(r3);box.appendChild(f);
  }
  admin.appendChild(box);
  var bar=el('div','abar');
  bar.appendChild(el('span','ast',statusMsg||(cloudOn()?'التعديلات تنحفظ تلقائياً':'قاعدة البيانات غير مربوطة بعد')));
  if(cloudOn()&&window.cloud.user())bar.appendChild(btn('تسجيل خروج','ghost',function(){window.cloud.logout().then(function(){if(admin){admin.remove();admin=null}})}));
  admin.appendChild(bar);admin.scrollTop=y;
}
</script>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/+esm";

var cfg=window.SBK_CONFIG||{};
if(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&String(cfg.SUPABASE_URL).indexOf('PASTE')!==0){
  var sb=createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  var me=null,busy=0,last='';
  sb.auth.getSession().then(function(r){me=(r.data&&r.data.session)?r.data.session.user:null});
  sb.auth.onAuthStateChange(function(ev,s){me=s?s.user:null});

  var wrap=function(error){
    var m=String(error.message||'').toLowerCase();
    var e=new Error(error.message||'error');
    e.code=(error.code==='42501'||m.indexOf('row-level security')>-1||m.indexOf('unauthorized')>-1||error.statusCode==='403'||error.statusCode===403)?'permission-denied':(error.code||'error');
    return e;
  };
  var q=async function(p){busy++;try{var r=await p;if(r&&r.error)throw wrap(r.error);return r}finally{busy--}};
  var uploadData=async function(dataUri){
    var blob=await (await fetch(dataUri)).blob();
    var path='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.jpg';
    var r=await sb.storage.from('covers').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
    if(r.error)throw wrap(r.error);
    return sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
  };
  var imgUrl=async function(x){return (x&&String(x).indexOf('data:')===0)?await uploadData(x):(x||'')};

  var cloud={
    ready:true,empty:false,
    user:function(){return me},
    login:async function(email,password){
      var r=await sb.auth.signInWithPassword({email:email,password:password});
      if(r.error)throw wrap(r.error);
      me=r.data.user;return r;
    },
    logout:function(){return sb.auth.signOut()},
    delBooks:function(ids){return ids&&ids.length?q(sb.from('books').delete().in('id',ids)):Promise.resolve()},
    delBook:function(id){return q(sb.from('books').delete().eq('id',id))},
    setBook:async function(cat,b,gone){
      busy++;
      try{
        if(gone&&gone.length)await q(sb.from('books').delete().in('id',gone));
        b.img=await imgUrl(b.img);
        await q(sb.from('books').upsert({id:b.id,cat_id:cat,t:b.t||'',a:b.a||'',d:b.d||'',p:b.p||'',img_url:b.img||'',position:b.o||Date.now(),s:false}));
      }finally{busy--}
    },
    setCat:async function(c){
      busy++;
      try{
        c.img=await imgUrl(c.img);
        await q(sb.from('categories').upsert({id:c.id,ar:c.ar,en:c.en||'',icon:c.icon||'',img_url:c.img||'',position:c.o||Date.now()}));
      }finally{busy--}
    },
    delCat:function(id){return q(sb.from('categories').delete().eq('id',id))},
    setSettings:function(info,theme){
      return q(sb.from('settings').upsert([{key:'info',value:info||{}},{key:'theme',value:theme||'white'}]));
    },
    uploadAll:async function(st){
      busy++;
      try{
        var cache={};
        var up=async function(x){if(x&&String(x).indexOf('data:')===0){if(!cache[x])cache[x]=await uploadData(x);return cache[x]}return x||''};
        var crows=[];
        for(var i=0;i<st.cats.length;i++){var c=st.cats[i];crows.push({id:c.id,ar:c.ar,en:c.en||'',icon:c.icon||'',img_url:await up(c.img),position:c.o||i+1})}
        await q(sb.from('categories').upsert(crows));
        var brows=[],ks=Object.keys(st.books);
        for(var a=0;a<ks.length;a++){var arr=st.books[ks[a]];for(var j=0;j<arr.length;j++){var b=arr[j];brows.push({id:b.id,cat_id:ks[a],t:b.t||'',a:b.a||'',d:b.d||'',p:b.p||'',img_url:await up(b.img),position:b.o||j+1,s:!!b.s})}}
        for(var k=0;k<brows.length;k+=100)await q(sb.from('books').upsert(brows.slice(k,k+100)));
        await q(sb.from('settings').upsert([{key:'info',value:st.info||{}},{key:'theme',value:st.theme||'white'}]));
      }finally{busy--}
      last='';await refresh();
    }
  };
  window.cloud=cloud;

  var refresh=async function(){
    if(busy)return;
    try{
      var rs=await Promise.all([sb.from('categories').select('*').order('position'),sb.from('books').select('*').order('position'),sb.from('settings').select('*')]);
      for(var n=0;n<rs.length;n++)if(rs[n].error)throw rs[n].error;
      var C=rs[0].data||[],B=rs[1].data||[],S=rs[2].data||[];
      if(!C.length){cloud.empty=true;if(window.sbkEmpty)window.sbkEmpty();return}
      cloud.empty=false;
      var cats=C.map(function(c){return {id:c.id,ar:c.ar,en:c.en||'',icon:c.icon||'',img:c.img_url||'',o:c.position}});
      var books={};cats.forEach(function(c){books[c.id]=[]});
      B.forEach(function(b){if(books[b.cat_id])books[b.cat_id].push({id:b.id,t:b.t||'',a:b.a||'',d:b.d||'',p:b.p||'',img:b.img_url||'',o:b.position,s:b.s?1:0})});
      var info=null,theme=null;
      S.forEach(function(x){if(x.key==='info')info=x.value;if(x.key==='theme')theme=x.value});
      var data={cats:cats,books:books,info:info,theme:theme};
      var sig=JSON.stringify(data);
      if(sig===last)return;
      last=sig;
      if(window.sbkRemote)window.sbkRemote(data);
    }catch(e){console.warn('Supabase:',e&&e.message||e)}
  };
  refresh();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh()});
  setInterval(function(){if(!document.hidden)refresh()},90000);
}
</script>
